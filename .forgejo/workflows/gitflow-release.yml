name: Branch Testing

on:
  push:
    branches:
      - 'release/*'
      - 'feature/*'

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Run Tests
    runs-on: 
      - ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RUNNER_TOKEN }}
      
      - name: Generate secrets files for testing
        run: |
          cp src/AspireDeezNuts.ApiService/appsettings.Development.secrets.template.json src/AspireDeezNuts.ApiService/appsettings.Development.secrets.json
          cp tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.template.json tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.json
      
      - name: Setup .NET
        uses: https://github.com/actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet packages
        uses: https://github.com/actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore dependencies
        run: make restore
      
      - name: Build solution
        run: make build
      
      - name: Run tests
        run: make test
      
      - name: Upload test results
        uses: https://github.com/actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-release-${{ github.run_number }}
          path: |
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/*.xml
          retention-days: 30