name: GitFlow Release Management

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch to create PR for (e.g., release/v1.2.0)'
        required: true
        type: string
      auto_merge:
        description: 'Auto-merge PR after creation (requires all checks to pass)'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RUNNER_TOKEN }}
      
      - name: Generate secrets files for testing
        run: |
          cp src/AspireDeezNuts.ApiService/appsettings.Development.secrets.template.json src/AspireDeezNuts.ApiService/appsettings.Development.secrets.json
          cp tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.template.json tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.json
      
      - name: Restore dependencies
        run: make restore
      
      - name: Build solution
        run: make build
      
      - name: Run tests
        run: make test

  create-release-pr:
    name: Create Release PR to Main
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RUNNER_TOKEN }}
      
      - name: Extract release version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME="${{ inputs.release_branch }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          VERSION=${BRANCH_NAME#release/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION from branch: $BRANCH_NAME"
      
      - name: Check if PR already exists
        id: check_pr
        run: |
          # Check if PR already exists from release branch to main
          PR_EXISTS=$(curl -s \
            -H "Authorization: token ${{ secrets.RUNNER_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls?state=open&head=${{ steps.version.outputs.branch }}&base=main" \
            | jq length)
          
          if [ "$PR_EXISTS" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "PR already exists for ${{ steps.version.outputs.branch }} -> main"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No existing PR found for ${{ steps.version.outputs.branch }} -> main"
          fi
      
      - name: Get commit messages for PR body
        id: commits
        if: steps.check_pr.outputs.exists == 'false'
        run: |
          # Fetch main branch for comparison
          git fetch origin main:main || git fetch origin main || echo "Could not fetch main branch"
          
          # Get commits that are in release branch but not in main
          COMMITS=$(git log main..${{ steps.version.outputs.branch }} --oneline --no-merges | head -20 2>/dev/null || echo "No commits found")
          
          # Format for PR body
          if [ -n "$COMMITS" ]; then
            echo "## Changes in this release:" >> pr_body.md
            echo "" >> pr_body.md
            while IFS= read -r commit; do
              echo "- $commit" >> pr_body.md
            done <<< "$COMMITS"
            echo "" >> pr_body.md
            echo "## Release Notes" >> pr_body.md
            echo "Version: ${{ steps.version.outputs.version }}" >> pr_body.md
            echo "" >> pr_body.md
            echo "This PR merges the release branch into main as part of the GitFlow process." >> pr_body.md
            echo "All tests must pass before this PR can be merged." >> pr_body.md
          else
            echo "No new commits found in release branch." >> pr_body.md
          fi
          
          # Read the body content for the API call
          PR_BODY=$(cat pr_body.md | sed 's/$/\\n/' | tr -d '\n' | sed 's/\\n$//')
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        id: create_pr
        if: steps.check_pr.outputs.exists == 'false'
        run: |
          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.RUNNER_TOKEN }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls" \
            -d '{
              "title": "Release ${{ steps.version.outputs.version }} → Main",
              "head": "${{ steps.version.outputs.branch }}",
              "base": "main",
              "body": "${{ steps.commits.outputs.body }}"
            }')
          
          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')
          PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url')
          
          if [ "$PR_NUMBER" != "null" ]; then
            echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "url=$PR_URL" >> $GITHUB_OUTPUT
            echo "✅ Created PR #$PR_NUMBER: $PR_URL"
          else
            echo "❌ Failed to create PR"
            echo "$PR_RESPONSE" | jq '.'
            exit 1
          fi
      
      - name: Add release label to PR
        if: steps.check_pr.outputs.exists == 'false' && steps.create_pr.outputs.number
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.RUNNER_TOKEN }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues/${{ steps.create_pr.outputs.number }}/labels" \
            -d '{"labels": ["release", "gitflow"]}'
          echo "Added release labels to PR #${{ steps.create_pr.outputs.number }}"
      
      - name: Summary
        run: |
          if [ "${{ steps.check_pr.outputs.exists }}" == "true" ]; then
            echo "## 📋 PR already exists"
            echo "A pull request already exists for ${{ steps.version.outputs.branch }} → main"
          else
            echo "## 🎉 Release PR Created"
            echo "- **PR Number**: #${{ steps.create_pr.outputs.number }}"
            echo "- **PR URL**: ${{ steps.create_pr.outputs.url }}"
            echo "- **Release Version**: ${{ steps.version.outputs.version }}"
            echo "- **Branch**: ${{ steps.version.outputs.branch }} → main"
          fi