name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Run Tests
    runs-on: 
      - ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate secrets files for testing
        run: |
          cp src/AspireDeezNuts.ApiService/appsettings.Development.secrets.template.json src/AspireDeezNuts.ApiService/appsettings.Development.secrets.json
          cp tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.template.json tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.json
      
      - name: Setup .NET
        uses: https://github.com/actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Cache NuGet packages
        uses: https://github.com/actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Generate secrets files for testing
        run: |
          cp src/AspireDeezNuts.ApiService/appsettings.Development.secrets.template.json src/AspireDeezNuts.ApiService/appsettings.Development.secrets.json
          cp tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.template.json tests/AspireDeezNuts.ApiService.Tests/appsettings.Development.secrets.json
      
      - name: Restore dependencies
        run: make restore
      
      - name: Build solution
        run: make build
      
      - name: Run tests
        run: make test
  
  build-containers:
    name: Build Container Images
    runs-on: 
      - ubuntu-24.04
      - docker
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    strategy:
      matrix:
        service: [api, web]
    
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      
      - name: Log in to Forgejo Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ github.server_url }}
          username: ${{ github.actor }}
          password: ${{ secrets.RUNNER_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ github.server_url }}/${{ github.repository }}/aspire-deez-nuts-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value={{branch}}-{{date 'YYYYMMDD-HHmmss'}}
      
      - name: Build and push ${{ matrix.service }} image
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: src/AspireDeezNuts.${{ matrix.service == 'api' && 'ApiService' || 'Web' }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

  quality-gate:
    name: Quality Gate
    runs-on: 
      - ubuntu-24.04
    needs: [test, build-containers]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed - blocking deployment"
            exit 1
          fi
          echo "✅ All tests passed"
      
      - name: Check build results
        run: |
          if [ "${{ needs.build-containers.result }}" != "success" ] && [ "${{ needs.build-containers.result }}" != "skipped" ]; then
            echo "❌ Container builds failed - blocking deployment"
            exit 1
          fi
          echo "✅ Container builds succeeded or were skipped"
      
      - name: Quality gate passed
        run: |
          echo "🎉 Quality gate passed - ready for deployment"