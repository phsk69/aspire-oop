name: Release Publishing

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string
      publish_latest:
        description: 'Also tag as latest'
        required: false
        type: boolean
        default: true

env:
  DOTNET_VERSION: '9.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-publish:
    name: Build and Publish Release Images
    runs-on: 
      - ubuntu-latest
      - docker
    
    strategy:
      matrix:
        service: [api, web]
    
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version_tag }}"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          
          # Remove 'v' prefix if present
          CLEAN_VERSION=${VERSION#v}
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (clean: $CLEAN_VERSION)"
      
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      
      - name: Log in to Forgejo Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ github.server_url }}
          username: ${{ github.actor }}
          password: ${{ secrets.RUNNER_TOKEN }}
      
      - name: Prepare image tags
        id: tags
        run: |
          REGISTRY="${{ github.server_url }}"
          REPO="${{ github.repository }}"
          SERVICE="${{ matrix.service }}"
          VERSION="${{ steps.version.outputs.version }}"
          CLEAN_VERSION="${{ steps.version.outputs.clean_version }}"
          
          # Base image name
          IMAGE_BASE="${REGISTRY}/${REPO}/aspire-deez-nuts-${SERVICE}"
          
          # Build tag list
          TAGS="${IMAGE_BASE}:${VERSION}"
          TAGS="${TAGS},${IMAGE_BASE}:${CLEAN_VERSION}"
          
          # Add latest tag if requested or if this is a release
          if [ "${{ inputs.publish_latest }}" == "true" ] || [ "${{ github.event_name }}" == "release" ]; then
            TAGS="${TAGS},${IMAGE_BASE}:latest"
          fi
          
          # Add major.minor tag for semver
          if [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            MAJOR_MINOR=$(echo "$CLEAN_VERSION" | cut -d. -f1-2)
            TAGS="${TAGS},${IMAGE_BASE}:${MAJOR_MINOR}"
          fi
          
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT
          echo "Built tags: $TAGS"
      
      - name: Build and push ${{ matrix.service }} release image
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: src/AspireDeezNuts.${{ matrix.service == 'api' && 'ApiService' || 'Web' }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=AspireDeezNuts.${{ matrix.service == 'api' && 'ApiService' || 'Web' }}
            org.opencontainers.image.description=Aspire Deez Nuts ${{ matrix.service == 'api' && 'API Service' || 'Web Application' }}
            org.opencontainers.image.version=${{ steps.version.outputs.clean_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.clean_version }}
            SERVICE_NAME=${{ matrix.service == 'api' && 'ApiService' || 'Web' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Verify published image
        run: |
          echo "🔍 Verifying published image..."
          docker pull ${{ steps.tags.outputs.image_base }}:${{ steps.version.outputs.version }}
          docker inspect ${{ steps.tags.outputs.image_base }}:${{ steps.version.outputs.version }}
          echo "✅ Image published successfully!"
      
      - name: Output image information
        run: |
          echo "## 📦 Published Images" >> $GITHUB_STEP_SUMMARY
          echo "**Service**: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags**:" >> $GITHUB_STEP_SUMMARY
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "**Registry**: ${{ github.server_url }}/${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
  
  create-deployment-manifests:
    name: Create Deployment Manifests
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'release' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
      
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version_tag }}"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Update Kubernetes manifests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REGISTRY="${{ github.server_url }}"
          REPO="${{ github.repository }}"
          
          # Update API service image
          sed -i "s|image: .*aspire-deez-nuts-api:.*|image: ${REGISTRY}/${REPO}/aspire-deez-nuts-api:${VERSION}|g" manifests/api-service.yaml
          
          # Update Web service image  
          sed -i "s|image: .*aspire-deez-nuts-web:.*|image: ${REGISTRY}/${REPO}/aspire-deez-nuts-web:${VERSION}|g" manifests/web-service.yaml
          
          echo "Updated manifests with version: $VERSION"
      
      - name: Create deployment artifact
        run: |
          mkdir -p deployment-${{ steps.version.outputs.version }}
          cp -r manifests/* deployment-${{ steps.version.outputs.version }}/
          
          # Create deployment script
          cat > deployment-${{ steps.version.outputs.version }}/deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Deploying Aspire Deez Nuts ${{ steps.version.outputs.version }}"
          
          # Apply all manifests
          kubectl apply -f .
          
          # Wait for deployments to be ready
          kubectl rollout status deployment/aspire-deez-nuts-api
          kubectl rollout status deployment/aspire-deez-nuts-web
          kubectl rollout status deployment/aspire-dashboard
          
          echo "✅ Deployment completed successfully!"
          EOF
          
          chmod +x deployment-${{ steps.version.outputs.version }}/deploy.sh
      
      - name: Upload deployment artifacts
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: deployment-manifests-${{ steps.version.outputs.version }}
          path: deployment-${{ steps.version.outputs.version }}/
          retention-days: 90
      
      - name: Summary
        run: |
          echo "## 🚀 Release ${{ steps.version.outputs.version }} Ready" >> $GITHUB_STEP_SUMMARY
          echo "Container images have been built and published to the Forgejo registry." >> $GITHUB_STEP_SUMMARY
          echo "Deployment manifests have been updated and are available as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Published:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ github.server_url }}/${{ github.repository }}/aspire-deez-nuts-api:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ github.server_url }}/${{ github.repository }}/aspire-deez-nuts-web:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY