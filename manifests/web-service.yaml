apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-deez-nuts-web
  labels:
    app: aspire-deez-nuts-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-deez-nuts-web
  template:
    metadata:
      labels:
        app: aspire-deez-nuts-web
    spec:
      containers:
        - name: web
          image: aspire-deez-nuts-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: aspire-these-nutz
            - configMapRef:
                name: aspire-these-nutz-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "aspire-deez-nuts-web"
          volumeMounts:
            - name: web-storage
              mountPath: /root/.aspnet/DataProtection-Keys
            - name: tls-certs
              mountPath: /tls
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: web-storage
          persistentVolumeClaim:
            claimName: aspire-web-data
        - name: tls-certs
          secret:
            secretName: aspire-web-tls
---
apiVersion: v1
kind: Service
metadata:
  name: aspire-deez-nuts-web
spec:
  selector:
    app: aspire-deez-nuts-web
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8443
      targetPort: 8443
      name: https
  type: LoadBalancer