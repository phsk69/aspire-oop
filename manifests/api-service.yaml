apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-deez-nuts-api
  labels:
    app: aspire-deez-nuts-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-deez-nuts-api
  template:
    metadata:
      labels:
        app: aspire-deez-nuts-api
    spec:
      containers:
        - name: api
          image: aspire-deez-nuts-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: aspire-these-nutz
            - configMapRef:
                name: aspire-api-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "aspire-deez-nuts-api"
          volumeMounts:
            - name: api-storage
              mountPath: /root/.aspnet/DataProtection-Keys
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: aspire-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: aspire-deez-nuts-api
spec:
  selector:
    app: aspire-deez-nuts-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http