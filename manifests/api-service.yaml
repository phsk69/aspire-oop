apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-deez-nuts-api
  labels:
    app: aspire-deez-nuts-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aspire-deez-nuts-api
  template:
    metadata:
      labels:
        app: aspire-deez-nuts-api
    spec:
      initContainers:
        - name: setup-ca-certs
          image: aspire-deez-nuts-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              if [ -f /tls/ca.crt ]; then
                cp /tls/ca.crt /usr/local/share/ca-certificates/cert-manager-ca.crt
                update-ca-certificates
                echo "CA certificate installed and trusted"
              fi
              cp -r /etc/ssl/certs/* /shared-certs/
          volumeMounts:
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            - name: shared-certs
              mountPath: /shared-certs
      containers:
        - name: api
          image: aspire-deez-nuts-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: aspire-these-nutz
            - secretRef:
                name: aspire-jwt-secret
            - secretRef:
                name: aspire-admin-seed
            - configMapRef:
                name: aspire-api-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "aspire-deez-nuts-api"
          volumeMounts:
            - name: api-storage
              mountPath: /root/.aspnet/DataProtection-Keys
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            - name: shared-certs
              mountPath: /etc/ssl/certs
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: aspire-api-data
        - name: tls-certs
          secret:
            secretName: aspire-api-tls
        - name: shared-certs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aspire-deez-nuts-api
spec:
  selector:
    app: aspire-deez-nuts-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8443
      targetPort: 8443
      name: https