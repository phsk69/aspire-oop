apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aspire-deez-nuts-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aspire-deez-nuts-ca
  namespace: default
spec:
  isCA: true
  commonName: aspire-deez-nuts-ca
  secretName: aspire-deez-nuts-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: aspire-deez-nuts-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aspire-deez-nuts-ca-issuer
spec:
  ca:
    secretName: aspire-deez-nuts-ca-secret