apiVersion: v1
kind: ConfigMap
metadata:
  name: aspire-these-nutz-config
data:
  ASPNETCORE_URLS: "https://+:8443;http://+:8080"
  ASPNETCORE_Kestrel__Certificates__Default__Path: "/tls/tls.crt"
  ASPNETCORE_Kestrel__Certificates__Default__KeyPath: "/tls/tls.key"
  DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  DOTNET_RESOURCE_SERVICE_ENDPOINT_URL: "http://aspire-dashboard:18892"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  DEPLOYMENT_ENVIRONMENT: "Kubernetes"
  API_BASE_URL: "http://aspire-deez-nuts-api:8080"
  DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: "false"
  services__aspire-deez-nuts-api__http__0: "http://aspire-deez-nuts-api:8080"
  services__aspire-deez-nuts-web__http__0: "http://aspire-deez-nuts-web:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aspire-api-config
data:
  ASPNETCORE_URLS: "http://+:8080"
  DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  DOTNET_RESOURCE_SERVICE_ENDPOINT_URL: "http://aspire-dashboard:18892"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
  OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  DEPLOYMENT_ENVIRONMENT: "Kubernetes"
  DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aspire-dashboard-config
data:
  ASPNETCORE_URLS: "https://+:18443;http://+:18888"
  ASPNETCORE_Kestrel__Certificates__Default__Path: "/tls/tls.crt"
  ASPNETCORE_Kestrel__Certificates__Default__KeyPath: "/tls/tls.key"
  DASHBOARD__OTLP__GRPCENDPOINT: "http://+:18889"
  DASHBOARD__OTLP__HTTPENDPOINT: "http://+:18890"
  DASHBOARD__RESOURCESERVICE__ENDPOINT: "http://+:18892"
  ASPNETCORE_DATAPROTECTION_APPLICATIONNAME: "aspire-dashboard"